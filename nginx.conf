# B4 — nginx config for the frontend image. Two jobs:
#
#   1. Serve the built static site, with an SPA fallback so a deep link
#      doesn't 404 against a file that doesn't exist on disk.
#   2. Reverse-proxy /api to the FastAPI container, so the browser only ever
#      talks to one origin. This is what makes src/lib/api.js's default
#      base path (`/api`) work identically in dev (Vite proxy) and in
#      Docker, and it means no CORS preflight is involved at all.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The pre-baked pipeline output is the bulk of the payload; it's
    # content-addressed by the build, so it's safe to cache hard.
    location /data/ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Trailing slash on the proxy_pass strips the /api prefix, matching
        # the Vite dev proxy's rewrite — FastAPI's routes live at the root.
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A /analyze run downloads SRTM tiles and a WorldCover window, then
        # scores the grid in Python — comfortably past nginx's 60s default
        # for a large AOI at fine resolution. The frontend shows an elapsed
        # timer and a cancel button for exactly this reason; the proxy needs
        # to not give up before the user does.
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }
}
